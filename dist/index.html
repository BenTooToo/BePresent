        animateFusion(target.querySelector('.dial'),[{transform:'scale(1)',filter:'brightness(1)'},{offset:.6,transform:'scale(1)',filter:'brightness(1)'},{offset:.85,transform:'scale(1.035)',filter:'brightness(1.7) blur(.6px)'},{transform:'scale(1)',filter:'brightness(1)'}],{duration:1450,easing:'ease-in-out'});
        const flight=animateFusion(ghost,[{transform:'translate(0,0) scale(1)',opacity:1,filter:'blur(0px)'},{offset:.72,opacity:.85,filter:'blur(.4px)'},{transform:`translate(${to.left-from.left}px,${to.top-from.top}px) scale(${to.width/from.width},${to.height/from.height})`,opacity:0,filter:'blur(5px)'}],{duration:1150,easing:'cubic-bezier(.65,0,.2,1)'});
        await flight.finished.catch(()=>{});ghost.remove();
        if(revision!==fusionRevision)return;
      }
      // Recheck after flight: editing or a resize must never leave stale visual copies.
      const focused=source.contains(document.activeElement);
      const positions=new Map([...container.children].filter(card=>card!==source).map(card=>[card,card.getBoundingClientRect()]));
      for(const city of cities)if(city.el===source)city.el=target;
      source.remove();refreshGroup(target);rememberFusion(target);update();
      fitViewportLayout();
      if(animationsEnabled()) {
        for(const [card,before] of positions) {
          const after=card.getBoundingClientRect(),zoom=after.width/card.offsetWidth;
          const rest=getComputedStyle(card).transform;
          animateFusion(card,[{transform:`translate(${(before.left-after.left)/zoom}px,${(before.top-after.top)/zoom}px) scale(${before.width/after.width}) ${rest==='none'?'':rest}`},{transform:rest}],{duration:600,easing:'cubic-bezier(.22,1,.36,1)'});
        }
        // The burst follows the clock as the grid settles into its new spacing.
        fusionTimer=setTimeout(()=>{if(revision===fusionRevision)burstFusion(target);},620);
      }
      if(focused)target.focus({preventScroll:true});
      await new Promise(resolve=>setTimeout(resolve,animationsEnabled()?720:0));
      if(revision===fusionRevision)mergeMatchingClocks(revision);
    }
    function render() {
      finishClockReorder(false);
      sortCities();
      pendingRemoval=null;
      container.style.gridTemplateRows='';
      renderedClockLimit=clockLimit();
      const revision=++fusionRevision;clearTimeout(fusionTimer);
      for(const animation of fusionAnimations)animation.cancel();
      document.querySelectorAll('.fusion-overlay,.fusion-particle,.fusion-halo').forEach(element=>element.remove());
      zoneSignature=currentZoneSignature();
      if (timeEdit) finishTimeEdit(true);
      container.replaceChildren();
      for (const city of cities) city.el=null;
      const visibleCities=visibleClockCities();
      for (const city of visibleCities) {
        const card = document.createElement('article'); card.className = 'clock-card';
        let ticks = '';
        for (let i=0;i<60;i++) ticks += `<line x1="120" y1="${i%5===0?12:13}" x2="120" y2="${i%5===0?22:17}" transform="rotate(${i*6} 120 120)" stroke="${i%5===0?'#929292':'#363636'}" stroke-width="${i%5===0?1.6:1}"/>`;
        let numerals='';
        const hours=settings.numeralCount===4?[12,3,6,9]:Array.from({length:12},(_,index)=>index+1);
        const numeralRadius=settings.numeralPosition==='outside'?136:86;
        for (const hour of hours) {
          const angle=hour*Math.PI/6;
          numerals+=`<text x="${(120+numeralRadius*Math.sin(angle)).toFixed(2)}" y="${(120-numeralRadius*Math.cos(angle)).toFixed(2)}">${hour}</text>`;
        }
        card.innerHTML = `<svg class="dial" viewBox="0 0 240 240" aria-hidden="true"><circle cx="120" cy="120" r="118" fill="none" stroke="#202020" stroke-width=".7"/>${ticks}<line class="hour" x1="120" y1="120" x2="120" y2="65"/><line class="minute" x1="120" y1="120" x2="120" y2="35"/><line class="second" x1="120" y1="137" x2="120" y2="30"/><circle cx="120" cy="120" r="3" fill="#eee"/></svg><div class="clock-label">${city.id==='paris'?`<span class="home">${t('local')}</span>`:''}</div><div class="city-line"><h2 class="city"></h2></div><p class="country"></p><time class="digital"></time><div class="clock-meta"><p class="date"></p><span class="zone"></span><p class="day-change" aria-live="polite" aria-atomic="true"></p></div>`;
        const numberGroup=document.createElementNS('http://www.w3.org/2000/svg','g');numberGroup.classList.add('dial-numbers');numberGroup.innerHTML=numerals;
        numberGroup.dataset.position=settings.numeralPosition;
        const dial=card.querySelector('.dial');
        const outsideNumbers=settings.enabled.numerals && settings.numeralPosition==='outside';
        dial.dataset.numeralPosition=outsideNumbers?'outside':'inside';
        dial.setAttribute('viewBox',outsideNumbers?'-28 -28 296 296':'0 0 240 240');
        dial.insertBefore(numberGroup,card.querySelector('.hour'));
        renderLines(card.querySelector('.city'),displayLanguages().map(lang=>cityName(city,lang)));
        renderLines(card.querySelector('.country'),displayLanguages().map(lang=>countryName(city,lang)));
        if (city.id !== 'paris') {
          const remove = document.createElement('button'); remove.className='remove'; remove.textContent='×'; remove.setAttribute('aria-label',t('remove').replace('{city}',cityName(city)));
          remove.onclick=()=>removeCityWithAnimation(city); card.append(remove);
        }
        bindTimeControls(card,city);
        bindTimeEditor(card,city);
        bindClockReordering(card);
        city.el=card; container.append(card);
      }
      // Restore completed fusions before painting, without replaying their entrance.
      const date=new Date();
      for(const [index,city] of visibleCities.entries()) {
        if(!settings.mergeTimezones)break;
        const partner=visibleCities.slice(0,index).find(other=>other.el && other.el!==city.el &&
          fusedPairs.has(fusionPairKey(city,other)) && !pendingFusionPairs.has(fusionPairKey(city,other)) && clockOffset(city,date)===clockOffset(other,date));
        if(!partner)continue;
        const source=city.el,target=partner.el;
        for(const member of cities)if(member.el===source)member.el=target;
        source.remove();
      }
      for(const card of container.children)refreshGroup(card);
      renderSettingsPreview();
      update();
      scheduleViewportLayout();
      if(settings.mergeTimezones)fusionTimer=setTimeout(()=>mergeMatchingClocks(revision),animationsEnabled()?750:0);
    }
    function renderSettingsPreview() {
      settingsPreview.replaceChildren();previewCity=null;
      if(settingsPanel.hidden || !container.firstElementChild)return;
      previewCity={...(catalog.find(city=>city.zone===localZone) || {id:'browser-local',name:t('local'),country:'',zone:localZone})};
      const card=container.firstElementChild.cloneNode(true);
      card.classList.remove('dragging');card.classList.add('preview-clock');
      card.removeAttribute('tabindex');card.setAttribute('aria-label',t('localPreview'));
      for(const element of card.querySelectorAll('.remove-actions,.remove,.time-editor'))element.remove();
      const time=card.querySelector('.digital');time.hidden=false;time.removeAttribute('role');time.removeAttribute('tabindex');
      const label=card.querySelector('.clock-label');label.replaceChildren();
      const home=document.createElement('span');home.className='home';home.textContent=t('local');label.append(home);
      renderLines(card.querySelector('.city'),displayLanguages().map(lang=>cityName(previewCity,lang)));
      renderLines(card.querySelector('.country'),displayLanguages().map(lang=>countryName(previewCity,lang)));
      for(const element of card.querySelectorAll('.date,.zone'))element.removeAttribute('aria-hidden');
      card.querySelector('.day-change').textContent='';
      settingsPreview.setAttribute('aria-label',t('localPreview'));
      previewCity.el=card;settingsPreview.append(card);
    }
    function paintClock(card,zone,date,name) {
      const parts=Object.fromEntries(formatter(zone).time.formatToParts(date).map(part=>[part.type,part.value]));
      const h=Number(parts.hour),m=Number(parts.minute),s=Number(parts.second);
      card.querySelector('.hour').setAttribute('transform',`rotate(${h*30+m/2+s/120} 120 120)`);
      card.querySelector('.minute').setAttribute('transform',`rotate(${m*6+s/10} 120 120)`);
      card.querySelector('.second').setAttribute('transform',`rotate(${s*6} 120 120)`);
      const time=card.querySelector('time');
      for(const [index,value] of [parts.hour,parts.minute,parts.second].entries()){
        const segments=time.querySelectorAll(`[data-time-part="${index}"]`);const number=segments[segments.length-1];
        if(number.textContent!==value)number.textContent=value;
      }
      time.dateTime=date.toISOString();time.setAttribute('aria-label',`${name} ${parts.hour}:${parts.minute}:${parts.second}`);
    }
    function updateSettingsPreview(date) {
      if(!previewCity)return;
      const {el:card,zone}=previewCity;
      paintClock(card,zone,date,cityName(previewCity));
      renderLines(card.querySelector('.date'),displayLanguages().map(lang=>localizedDate(zone,lang,date)));
      const offset=formatter(zone).offset.formatToParts(date).find(part=>part.type==='timeZoneName').value.replace('GMT','UTC');
      card.querySelector('.zone').textContent=offset==='UTC'?'UTC+0':offset;
    }
    function update() {
      updateClockIcon();
      if(zoneSignature && zoneSignature!==currentZoneSignature()){render();return;}
      const realNow = new Date();
      const exploring = previewTimestamp!==null;
      const now = exploring ? new Date(previewTimestamp) : realNow;
      const parisDay = calendarDay('Europe/Paris',now);
      const painted=new Set();
      for (const city of cities) {
        const f=formatter(city.zone);
        const card=city.el;
        if(!card || painted.has(card))continue;
        painted.add(card);
        const members=cities.filter(item=>item.el===card);
        paintClock(card,city.zone,now,members.map(item=>cityName(item)).join('/'));
        const day=calendarDay(city.zone,now);
        renderLines(card.querySelector('.date'),displayLanguages().map(lang=>localizedDate(city.zone,lang,now)+(day===parisDay?'':` · ${t(day>parisDay?'nextDate':'previousDate',lang)}`)));
        const offset=f.offset.formatToParts(now).find(p=>p.type==='timeZoneName').value.replace('GMT','UTC');
        card.querySelector('.zone').textContent=offset==='UTC'?'UTC+0':offset;
        card.querySelector('.date').setAttribute('aria-hidden',String(exploring));
        card.querySelector('.zone').setAttribute('aria-hidden',String(exploring));
        const dayDelta=exploring && !members.some(item=>item.id===previewAnchorCityId) ? calendarDay(city.zone,now)-calendarDay(city.zone,realNow) : 0;
        const dayLabel=dayMessage(dayDelta);
        const dayChange=card.querySelector('.day-change');
        if (dayChange.textContent!==dayLabel) dayChange.textContent=dayLabel;
        dayChange.classList.toggle('future',dayDelta>0);
        dayChange.classList.toggle('past',dayDelta<0);
      }
      updateSettingsPreview(realNow);
    }
    function showOptions() {
      const query=search.value.trim().toLowerCase(); options.replaceChildren();
      const matches=catalog.filter(c=>!cities.some(x=>x.id===c.id)&&`${c.name} ${c.country} ${c.zone} ${Object.keys(languageOptions).map(lang=>cityName(c,lang)).join(' ')}`.toLowerCase().includes(query)).slice(0,40);
      for (const city of matches) {
        const button=document.createElement('button'); button.className='city-option';
        button.append(document.createTextNode(cityName(city))); const label=document.createElement('span'); label.textContent=city.zone; button.append(label);
        button.onclick=()=>{
          if(cities.length>=clockLimit())return;
          // Adding a city is a new entrance, even when this pair fused in the past.
          if(settings.mergeTimezones && animationsEnabled()) {
            const date=new Date();
            for(const existing of cities)if(clockOffset(existing,date)===clockOffset(city,date))pendingFusionPairs.add(fusionPairKey(existing,city));
          }
          cities.push({...city});save();render();picker.close();
        }; options.append(button);
      }
      if (!matches.length) { const p=document.createElement('p'); p.className='empty';p.textContent=t('noResults');options.append(p); }
    }
    document.getElementById('add').onclick=()=>{if(cities.length>=clockLimit())return;search.value='';showOptions();picker.showModal();search.focus();};
    document.addEventListener('keydown',event=>{if(event.key==='Escape' && !picker.open && !developerConfirm.open){if(timeEdit)finishTimeEdit(true);else if(!settingsPanel.hidden)setSettingsOpen(false);else resetPreview();}});
    let backgroundGesture = null;
    document.addEventListener('pointerdown',event=>{
      backgroundGesture={pointerId:event.pointerId,x:event.clientX,y:event.clientY,moved:false};
      if(timeEdit && !timeEdit.form.contains(event.target) && event.target!==timeEdit.digital)finishTimeEdit();
    },{capture:true});
    document.addEventListener('pointermove',event=>{
      if(backgroundGesture?.pointerId===event.pointerId && Math.hypot(event.clientX-backgroundGesture.x,event.clientY-backgroundGesture.y)>3)backgroundGesture.moved=true;
    },{capture:true,passive:true});
    document.addEventListener('click',event=>{
      if(previewTimestamp===null || event.button!==0 || event.defaultPrevented || activeDrag || backgroundGesture?.moved || picker.open || !settingsPanel.hidden)return;
      if(event.target.closest('.clock-card,button,a,input,select,textarea,label,dialog,.settings-panel,[role="button"],[role="switch"],[contenteditable]'))return;
      resetPreview();
    });
    document.getElementById('close-picker').onclick=()=>picker.close();
    picker.addEventListener('click',e=>{if(e.target===picker){const r=picker.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)picker.close();}});
    search.oninput=showOptions;
    document.getElementById('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{document.getElementById('fullscreen').title=t('fullscreenUnavailable');}};
    document.addEventListener('fullscreenchange',()=>{const label=t(document.fullscreenElement?'exitFullscreen':'fullscreen');document.getElementById('fullscreen').setAttribute('aria-label',label);document.getElementById('fullscreen').title=label;});
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)update();});
    let viewportLayoutFrame;
    let renderedClockLimit;
    let fittedClockLayout=null;
    const viewportAnimations=new Map();
    function isPhoneLayout() {
      return matchMedia('(max-width:700px), (max-width:1000px) and (max-height:500px)').matches;
    }
    function clockLimit() { return isPhoneLayout()?6:8; }
    function visibleClockCities() { return cities.filter(city=>settings.enabled.localTime || city.zone!==localZone).slice(0,clockLimit()); }
    function scheduleViewportLayout() {
      cancelAnimationFrame(viewportLayoutFrame);
      viewportLayoutFrame=requestAnimationFrame(fitViewportLayout);
    }
    function arrangeClockRows(columns) {
      const cards=[...container.children];
      const rows=Math.ceil(cards.length/columns);
      // Half-card tracks let both odd and even rows share the same center axis.
      container.style.gridTemplateColumns=`repeat(${columns*2},minmax(0,1fr))`;
      let index=0;
      for(let row=0;row<rows;row++) {
        const count=Math.min(columns,cards.length-index);
        for(let column=0;column<count;column++) {
          const card=cards[index++];
          card.style.gridRow=String(row+1);
          card.style.gridColumn=`${columns-count+1+column*2} / span 2`;
        }
      }
    }
    function fitViewportLayout() {
      if(renderedClockLimit!==clockLimit()) {
        if(cities.length>Math.min(renderedClockLimit,clockLimit())){render();return;}
        renderedClockLimit=clockLimit();
      }
      if(pendingRemoval || clockReorder?.moved)return;
      const addButton=document.getElementById('add');
      addButton.disabled=cities.length>=clockLimit();
      const limitMessages={zh:`最多显示 ${clockLimit()} 个时钟`,en:`Maximum ${clockLimit()} clocks`,fr:`${clockLimit()} horloges maximum`};
      addButton.title=addButton.disabled?(limitMessages[settings.language] || limitMessages.en):t('add');
      addButton.setAttribute('aria-label',addButton.title);
      if(addButton.disabled && picker.open)picker.close();
      const region=document.querySelector('.clock-scroll');
      const availableWidth=Math.max(1,region.clientWidth-16);
      const availableHeight=Math.max(1,region.clientHeight-16);
      const gap=parseFloat(getComputedStyle(container).columnGap);
      const cards=[...container.children];
      const previous=fittedClockLayout;
      const sameCards=previous && previous.cards.length===cards.length && previous.cards.every((card,index)=>card===cards[index]);
      const previousRects=new Map(cards.map(card=>[card,card.getBoundingClientRect()]));
      const candidates=[];
      const minimumCardWidth=cards.length?Math.max(112,parseFloat(getComputedStyle(cards[0].querySelector('.digital')).fontSize)*4.5):112;
      container.style.zoom=1;
      const count=container.childElementCount;
      if(!count) {
        container.style.width='0px';container.style.gridTemplateColumns='none';container.dataset.columns='0';fittedClockLayout=null;
      }
      // Prefer a single row until the clocks become small; wrap only when height allows it.
      for(let columns=count;columns>=1;columns--) {
        const rows=Math.ceil(count/columns);
        const width=availableWidth/1.04;
        container.style.width=width+'px';
        arrangeClockRows(columns);
        container.style.setProperty('--dial-size','0px');
        const cardWidth=Math.max(1,(width-(columns-1)*gap)/columns);
        if(columns>1 && cardWidth<minimumCardWidth)continue;
        // Keep labels readable by shrinking the dial before scaling the whole card.
        const dialSize=Math.max(48,Math.min(320,cardWidth,(availableHeight/1.04-container.offsetHeight)/rows));
        container.style.setProperty('--dial-size',dialSize+'px');
        const scale=Math.min(1,availableWidth/(width*1.04),availableHeight/Math.max(1,container.offsetHeight*1.04));
        const readable=(settings.enabled.analog?Math.min(dialSize,cardWidth):cardWidth)*scale;
        const score=readable+70*scale;
        candidates.push({columns,width,scale,score,dialSize,readable});
      }
      let best=candidates.find(candidate=>candidate.readable>=220) || candidates.reduce((best,candidate)=>!best || candidate.score>best.score?candidate:best,null);
      // Different wrap and unwrap thresholds prevent flickering at a breakpoint.
      const current=sameCards && candidates.find(candidate=>candidate.columns===previous.columns);
      if(current && best && ((best.columns<current.columns && current.readable>=200) || (best.columns>current.columns && best.readable<240 && current.readable>=best.readable*.85)))best=current;
      if(best) {
        container.style.width=best.width+'px';
        arrangeClockRows(best.columns);
        container.style.setProperty('--dial-size',best.dialSize+'px');
        container.style.zoom=best.scale;
        container.dataset.columns=String(best.columns);
        const resized=sameCards && (previous.width!==innerWidth || previous.height!==innerHeight);
        if(resized && previous.columns!==best.columns && animationsEnabled() && settingsPanel.hidden && !activeDrag && !document.querySelector('.fusion-overlay')) {
          for(const animation of viewportAnimations.values())animation.cancel();
          viewportAnimations.clear();
          region.classList.add('is-reflowing');
          for(const card of cards) {
            const before=previousRects.get(card),after=card.getBoundingClientRect(),zoom=after.width/card.offsetWidth;
            const rest=getComputedStyle(card).transform;
            const animation=animateFusion(card,[{transform:`translate(${(before.left-after.left)/zoom}px,${(before.top-after.top)/zoom}px) scale(${before.width/after.width}) ${rest==='none'?'':rest}`},{transform:rest}],{duration:600,easing:'cubic-bezier(.22,1,.36,1)'});
            viewportAnimations.set(card,animation);
            animation.finished.catch(()=>{}).finally(()=>{
              if(viewportAnimations.get(card)===animation)viewportAnimations.delete(card);
              if(!viewportAnimations.size)region.classList.remove('is-reflowing');
            });
          }
        }
        fittedClockLayout={cards,columns:best.columns,width:innerWidth,height:innerHeight};
      }
      if(!settingsPanel.hidden) {
        const body=settingsPanel.querySelector('.settings-body');
        const heading=settingsPanel.querySelector('.settings-heading');
        const style=getComputedStyle(settingsPanel);
        const width=settingsPanel.clientWidth-parseFloat(style.paddingLeft)-parseFloat(style.paddingRight);
        const height=settingsPanel.clientHeight-parseFloat(style.paddingTop)-parseFloat(style.paddingBottom)-heading.offsetHeight-parseFloat(getComputedStyle(heading).marginBottom)-settingsPanel.querySelector('.settings-footer').offsetHeight;
        body.style.zoom=1;
        body.style.width=Math.max(480,Math.min(1240,width))+'px';
        body.style.zoom=Math.min(1,width/body.offsetWidth,height/Math.max(1,body.offsetHeight));
      }
      positionCaptureStatus();
    }
    const viewportLayoutObserver=new ResizeObserver(scheduleViewportLayout);
    viewportLayoutObserver.observe(document.querySelector('main'));
    viewportLayoutObserver.observe(container);
    viewportLayoutObserver.observe(settingsPanel);
    viewportLayoutObserver.observe(settingsPanel.querySelector('.settings-body'));
    window.addEventListener('resize',scheduleViewportLayout,{passive:true});
    window.visualViewport?.addEventListener('resize',scheduleViewportLayout,{passive:true});
    document.fonts.ready.then(scheduleViewportLayout);
    // The tab icon follows real local time, independently of city and time previews.
    const clockFavicon=document.getElementById('clock-favicon');
    let faviconHour=-1;
    function updateClockIcon() {
      const hour=new Date().getHours()%12 || 12;
      if(hour===faviconHour)return;
      clockFavicon.setAttribute('href',`assets/icons/clock-${String(hour).padStart(2,'0')}.svg`);
      faviconHour=hour;
    }
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)updateClockIcon();});
    window.addEventListener('focus',updateClockIcon);
    window.addEventListener('pageshow',updateClockIcon);
    applySettings(); setInterval(update,250);
  </script>
</body>
